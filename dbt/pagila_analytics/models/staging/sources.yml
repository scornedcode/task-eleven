version: 2

sources:
  - name: pagila_source
    database: RAW_DATA
    schema: PAGILA
    freshness:
      warn_after: { count: 12, period: hour }
      error_after: { count: 24, period: hour }
    loaded_at_field: _AIRBYTE_EXTRACTED_AT
    tables:
      - name: film
      - name: payment
      - name: customer
      - name: rental
      - name: inventory
      - name: actor
      - name: category
      - name: address
      - name: city
      - name: film_actor
      - name: country
      - name: film_category